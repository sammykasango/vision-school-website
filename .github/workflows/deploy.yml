name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Compile TanStack Start project
        run: npm run build

      - name: Inject 404 fallback for routing safety
        run: cp dist/client/index.html dist/client/404.html # 👈 Targets the real compiled index.html

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/client' 

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
