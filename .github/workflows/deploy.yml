name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Compile Portfolio Project
        run: npm run build

      # 👇 Fixed: Copies your root index.html straight to root 404.html without subfolders
      - name: Inject 404 SPA fallback Routing Hook
        run: cp index.html 404.html

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      # 👇 Fixed: Uploads your root folder directly where all your real site files sit
      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
