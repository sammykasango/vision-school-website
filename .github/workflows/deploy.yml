name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: write # Granted write access to update portfolio branch files
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Compile Portfolio Project
        run: npm run build

      - name: Inject 404 SPA fallback Routing Hook
        run: |
          # Finds your compiled index.html file and clones it to 404.html for routing protection
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html
            echo "Successfully generated dist 404 handler."
          elif [ -d "build" ]; then
            cp build/index.html build/404.html
            echo "Successfully generated build 404 handler."
          else
            cp index.html 404.html || true
            echo "Standard fallback rule initiated."
          fi

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          # Automatically detects your compiled folder location to send code straight to the server
          path: ${{ ee.env.DEST_DIR || (directory-exists('dist') && 'dist' || (directory-exists('build') && 'build' || '.')) }}

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
