name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Triggers the build every time you push changes to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Clear deprecation warnings with modern environments
          cache: 'npm'

      - name: Install project dependencies
        run: npm install # Safely resolve packages without hitting strict lockfile crashes

      - name: Compile TanStack Start project
        run: npm run build

      - name: Dynamic Shell Creator for GitHub Pages Compatibility
        run: mkdir -p dist && echo '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="google-site-verification" content="YOUR_ACTUAL_VERIFICATION_STRING_HERE" /><link rel="icon" type="image/x-icon" href="https://github.io"><title>Vision Kindergarten & Primary School</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>' > dist/index.html && cp dist/index.html dist/404.html

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Point straight to the custom target asset directory

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
