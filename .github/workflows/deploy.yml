name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Compile TanStack Start project
        run: npm run build

      - name: Inject 404 fallback for routing safety
        run: |
          # Dynamically search the true output folder for your compiled entry shell
          ENTRY_FILE=$(find .output/public -name "index.html" -o -name "_shell.html" | head -n 1)
          if [ -n "$ENTRY_FILE" ]; then
            cp "$ENTRY_FILE" .output/public/404.html
            # If the entry point isn't named index.html at the root level, make a copy of it there too
            if [ "$ENTRY_FILE" != ".output/public/index.html" ]; then
              cp "$ENTRY_FILE" .output/public/index.html
            fi
            echo "Successfully mapped framework entry points."
          else
            echo "Warning: Entry files not discovered."
          fi

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.output/public' # 👈 Point straight to your framework's actual compiled code

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
