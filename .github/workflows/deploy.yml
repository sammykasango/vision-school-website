name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Inject 404 SPA fallback Routing Hook
        run: cp dist/index.html dist/404.html
      - name: Install project dependencies
        run: npm install

      - name: Compile TanStack Start project
        run: npm run build

      - name: Dynamic Shell Creator for GitHub Pages Compatibility
        run: |
          # 1. Duplicate your framework's real compiled index to preserve true hashes
          cp dist/client/index.html dist/client/404.html
          
          # 2. Automatically patch your bundle path variables to support the github subdirectory layout
          sed -i 's|href="/assets/|href="/vision-school-website/assets/|g' dist/client/index.html
          sed -i 's|src="/assets/|src="/vision-school-website/assets/|g' dist/client/index.html
          sed -i 's|href="/assets/|href="/vision-school-website/assets/|g' dist/client/404.html
          sed -i 's|src="/assets/|src="/vision-school-website/assets/|g' dist/client/404.html
          
          echo "Successfully patched deployment pathways."

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/client'

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
