name: Deploy to GitHub Pages

on:
  push:
    branches: 'main' # Triggers the build every time you push changes to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Updated to 24 to remove deprecation warning
          cache: 'npm'

      - name: Install project dependencies
        run: npm install # Changed to install to prevent missing lockfile crashes

      - name: Compile TanStack Start project
        run: npm run build # Restored the missing build execution step

      - name: Inject 404 fallback for routing safety
        run: cp dist/index.html dist/404.html # Target standard dist output folder

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Points directly to your compiled build folder

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
