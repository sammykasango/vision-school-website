name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install project dependencies
        run: npm install

      - name: Compile Portfolio Project
        run: npm run build

      # 👇 Creates the routing safety fallback right inside the compilation bundle
      - name: Inject 404 SPA fallback Routing Hook
        run: |
          if [ -d "dist" ]; then
            cp dist/index.html dist/404.html
          elif [ -d "build" ]; then
            cp build/index.html build/404.html
          else
            cp index.html 404.html || true
          fi

      - name: Configure GitHub Pages assets
        uses: actions/configure-pages@v5

      # 👇 Uploads the correct folder structure explicitly
      - name: Upload compiled static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            dist
            build
            .
          if-no-files-found: ignore

      - name: Deploy to GitHub Pages Production
        id: deployment
        uses: actions/deploy-pages@v4
